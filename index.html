<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <title>ReedHycalog/NOV</title>
    <link rel="shortcut icon" href="LOGO_NOV.svg""/>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="video_pozo_2.mp4" />
    <img
      src="logo_reedhycalog_blanco.png"
      alt="Logotipo de la empresa de perforación"
      class="mi-imagen"
    />
  </head>
  <body>
    <video autoplay muted loop id="video-fondo">
      <source src="video_pozo_2.mp4" type="video/mp4" />
    </video>
    <div class="login-container">
      <h2>Acceso al sistema</h2>
      <p>Ingresa tus credenciales para continuar</p>

      <form id="login-form">
        <div class="input-group">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            placeholder="Ingresa tu usuario"
            required
          />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="Ingresa tu contraseña"
              required
            />
            <button type="button" id="toggle-password" class="toggle-btn">
              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>

      <!--mensaje de error si la contraseña está mal-->
      <p id="error-message" class="error-msg"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
